<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Department Name Routing Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .test-section { margin: 20px 0; padding: 15px; border: 1px solid #ddd; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        .info { background-color: #d1ecf1; border-color: #bee5eb; }
        button { padding: 10px 15px; margin: 5px; cursor: pointer; }
        .result { margin-top: 10px; padding: 10px; border-radius: 3px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background-color: #f2f2f2; }
        .route-correct { color: green; font-weight: bold; }
        .route-incorrect { color: red; font-weight: bold; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; font-size: 12px; }
    </style>
</head>
<body>
    <h1>Department Name Routing Test</h1>
    <p>Testing the new department-name-based routing logic</p>

    <div class="test-section">
        <h3>Test All Three Managers</h3>
        <button onclick="testAllManagers()">Test Department-Based Routing</button>
        <div id="allManagersResult"></div>
    </div>

    <script>
        const API_BASE = 'http://localhost:5000/api';

        async function testAllManagers() {
            const resultDiv = document.getElementById('allManagersResult');
            resultDiv.innerHTML = '<div class="info">Testing department-based routing...</div>';

            const managers = [
                { 
                    email: 'zondis411@gmail.com', 
                    name: 'Sandile Zondi',
                    expectedDepartment: 'Quality Assurance',
                    expectedRoute: '/qa-manager-dashboard',
                    expectedDashboard: 'QA Manager Dashboard'
                },
                { 
                    email: 'maphangomaphango931@gmail.com', 
                    name: 'Sandile Zondi',
                    expectedDepartment: 'Logistic',
                    expectedRoute: '/logistics-manager-dashboard',
                    expectedDashboard: 'Logistics Manager Dashboard'
                },
                { 
                    email: 'nkwenkwezi68@gmail.com', 
                    name: 'Zandile Kubeka',
                    expectedDepartment: 'Administration',
                    expectedRoute: '/admin-manager-dashboard',
                    expectedDashboard: 'Admin Manager Dashboard'
                }
            ];

            let results = [];
            let successCount = 0;

            for (const manager of managers) {
                try {
                    const response = await fetch(`${API_BASE}/auth/login`, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json',
                        },
                        body: JSON.stringify({
                            email: manager.email,
                            password: 'password123'
                        })
                    });

                    if (response.ok) {
                        const data = await response.json();
                        const userData = data.user;
                        
                        const normalizedUser = {
                            role: userData?.role ?? userData?.Role,
                            skillsDevelopmentProviderId: userData?.skillsDevelopmentProviderId ?? userData?.SkillsDevelopmentProviderId,
                            departmentId: userData?.departmentId ?? userData?.DepartmentId,
                            departmentName: userData?.departmentName ?? userData?.DepartmentName,
                            clientId: userData?.clientId ?? userData?.ClientId
                        };

                        console.log(`Testing ${manager.email}:`, normalizedUser);

                        // Apply the NEW department-name-based routing logic
                        let actualRoute = '';
                        let routingReason = '';
                        
                        const departmentName = normalizedUser.departmentName?.toLowerCase() || '';
                        
                        if (departmentName.includes('quality')) {
                            actualRoute = '/qa-manager-dashboard';
                            routingReason = 'Quality Department';
                        } else if (departmentName.includes('logistic')) {
                            actualRoute = '/logistics-manager-dashboard';
                            routingReason = 'Logistics Department';
                        } else if (departmentName.includes('admin')) {
                            actualRoute = '/admin-manager-dashboard';
                            routingReason = 'Administration Department';
                        } else if ((normalizedUser.role === 5 || normalizedUser.role === '5') && normalizedUser.departmentId) {
                            actualRoute = '/logistics-manager-dashboard';
                            routingReason = 'Logistics Role (Fallback)';
                        } else if ((normalizedUser.role === 3 || normalizedUser.role === '3') && normalizedUser.departmentId) {
                            actualRoute = '/admin-manager-dashboard';
                            routingReason = 'Admin Role (Fallback)';
                        } else if (normalizedUser.role === 7 || normalizedUser.role === '7') {
                            actualRoute = '/sdp-manager-dashboard';
                            routingReason = 'Moderator Role (Fallback)';
                        } else {
                            actualRoute = '/sdp-dashboard';
                            routingReason = 'Default SDP';
                        }

                        const isCorrect = actualRoute === manager.expectedRoute;
                        if (isCorrect) successCount++;

                        results.push({
                            ...manager,
                            actualRoute,
                            routingReason,
                            isCorrect,
                            userData: normalizedUser
                        });
                    } else {
                        results.push({
                            ...manager,
                            error: 'Login failed'
                        });
                    }
                } catch (error) {
                    results.push({
                        ...manager,
                        error: error.message
                    });
                }
            }

            // Display results
            let html = `<div class="${successCount === managers.length ? 'success' : 'error'}">`;
            html += `<h4>Department-Based Routing Test Results: ${successCount}/${managers.length} Correct</h4>`;
            html += '<table>';
            html += '<tr><th>Manager</th><th>Department</th><th>Expected Route</th><th>Actual Route</th><th>Routing Reason</th><th>Status</th></tr>';
            
            results.forEach(result => {
                if (result.error) {
                    html += `<tr><td>${result.name}</td><td>${result.expectedDepartment}</td><td>${result.expectedRoute}</td><td colspan="3">${result.error}</td></tr>`;
                } else {
                    const statusClass = result.isCorrect ? 'route-correct' : 'route-incorrect';
                    const statusIcon = result.isCorrect ? '✅' : '❌';
                    
                    html += `<tr>
                        <td>${result.name}<br><small>${result.email}</small></td>
                        <td>${result.userData.departmentName}<br><small>Expected: ${result.expectedDepartment}</small></td>
                        <td>${result.expectedRoute}</td>
                        <td class="${statusClass}">${result.actualRoute}</td>
                        <td>${result.routingReason}</td>
                        <td>${statusIcon}</td>
                    </tr>`;
                }
            });
            
            html += '</table>';
            
            if (successCount === managers.length) {
                html += '<div style="margin-top: 15px; padding: 10px; background-color: #d4edda; border-radius: 5px;">';
                html += '<strong>🎉 SUCCESS!</strong> All managers now route to their department-specific dashboards based on department names!';
                html += '</div>';
            } else {
                html += '<div style="margin-top: 15px; padding: 10px; background-color: #f8d7da; border-radius: 5px;">';
                html += '<strong>❌ ISSUES FOUND:</strong> Some managers are not routing correctly. Check the department name matching logic.';
                html += '</div>';
            }
            
            // Show debug info for first user
            if (results.length > 0 && results[0].userData) {
                html += '<h5>Debug Info (First User):</h5>';
                html += `<pre>${JSON.stringify(results[0].userData, null, 2)}</pre>`;
            }
            
            html += '</div>';
            resultDiv.innerHTML = html;
        }
    </script>
</body>
</html>
