<!DOCTYPE html>
<html>
<head>
    <title>Test QA API - Final</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>QA API Test - Final</h1>
    <button onclick="testQAMetrics()">Test QA Metrics</button>
    <button onclick="testUnitStandardBreakdown()">Test Unit Standard Breakdown</button>
    <div id="result"></div>

    <script>
        async function testQAMetrics() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing QA Metrics...</div>';
            
            try {
                const response = await fetch('http://192.168.68.117:5213/api/QAOverview/metrics');
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ QA Metrics Success!</h3>
                            <h4>Summary:</h4>
                            <ul>
                                <li><strong>Total Qualifications:</strong> ${data.totalQualifications} (${data.legacyQualifications} legacy, ${data.occupationalQualifications} occupational)</li>
                                <li><strong>Total Unit Standards:</strong> ${data.totalUnitStandards} (${data.legacyUnitStandards} legacy, ${data.occupationalUnitStandards} occupational)</li>
                                <li><strong>Total Questions:</strong> ${data.totalQuestions} (${data.formativeQuestions} formative, ${data.summativeQuestions} summative)</li>
                                <li><strong>Total Assessments:</strong> ${data.totalAssessments} (${data.formativeAssessments} formative, ${data.summativeAssessments} summative)</li>
                                <li><strong>Active Projects:</strong> ${data.activeProjectsWithQualifications}</li>
                                <li><strong>Project Qualifications:</strong> ${data.projectQualifications}</li>
                                <li><strong>Project Unit Standards:</strong> ${data.projectUnitStandards}</li>
                            </ul>
                            <details>
                                <summary>Raw JSON Data</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ QA Metrics Error: ${response.status}</h3>
                            <p>${response.statusText}</p>
                            <pre>${errorText}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testUnitStandardBreakdown() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing Unit Standard Breakdown...</div>';
            
            try {
                const response = await fetch('http://192.168.68.117:5213/api/QAOverview/unit-standard-breakdown');
                
                if (response.ok) {
                    const data = await response.json();
                    
                    let summaryHtml = '';
                    if (data.length > 0) {
                        const totalFormative = data.reduce((sum, us) => sum + us.formativeQuestions, 0);
                        const totalSummative = data.reduce((sum, us) => sum + us.summativeQuestions, 0);
                        const totalQuestions = totalFormative + totalSummative;
                        
                        summaryHtml = `
                            <h4>Unit Standards with Assessment Questions:</h4>
                            <ul>
                                <li><strong>Total Unit Standards:</strong> ${data.length}</li>
                                <li><strong>Total Questions:</strong> ${totalQuestions} (${totalFormative} formative, ${totalSummative} summative)</li>
                            </ul>
                            <h5>Examples:</h5>
                            <ul>
                        `;
                        
                        data.slice(0, 3).forEach(us => {
                            summaryHtml += `
                                <li><strong>${us.unitStandardName}</strong> (Level ${us.level}, ${us.credits} credits): 
                                ${us.formativeQuestions} formative questions, ${us.summativeQuestions} summative questions, 0 logbook questions</li>
                            `;
                        });
                        
                        summaryHtml += '</ul>';
                    }
                    
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Unit Standard Breakdown Success!</h3>
                            <p>Found ${data.length} unit standards with assessment questions</p>
                            ${summaryHtml}
                            <details>
                                <summary>Complete JSON Data</summary>
                                <pre>${JSON.stringify(data, null, 2)}</pre>
                            </details>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Unit Standard Breakdown Error: ${response.status}</h3>
                            <p>${response.statusText}</p>
                            <pre>${errorText}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
