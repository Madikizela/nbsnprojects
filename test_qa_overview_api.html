<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test QA Overview API</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .result { background: #f5f5f5; padding: 15px; border-radius: 5px; margin: 10px 0; }
        .error { background: #ffebee; color: #c62828; }
        .success { background: #e8f5e8; color: #2e7d32; }
        button { padding: 10px 20px; margin: 5px; cursor: pointer; }
        pre { white-space: pre-wrap; word-wrap: break-word; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎯 QA Overview API Test</h1>
        
        <div>
            <button onclick="testQAMetrics()">Test QA Metrics Endpoint</button>
            <button onclick="clearResults()">Clear Results</button>
        </div>
        
        <div id="results"></div>
    </div>

    <script>
        const API_BASE = 'http://192.168.68.117:5213/api';
        
        function addResult(title, content, isError = false) {
            const results = document.getElementById('results');
            const div = document.createElement('div');
            div.className = `result ${isError ? 'error' : 'success'}`;
            div.innerHTML = `<h3>${title}</h3><pre>${content}</pre>`;
            results.appendChild(div);
        }
        
        function clearResults() {
            document.getElementById('results').innerHTML = '';
        }
        
        async function testQAMetrics() {
            try {
                addResult('🔄 Testing QA Metrics', 'Fetching QA overview metrics...');
                
                const response = await fetch(`${API_BASE}/QAOverview/metrics`, {
                    method: 'GET',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const data = await response.json();
                
                if (response.ok) {
                    addResult('✅ QA Metrics Success', JSON.stringify(data, null, 2));
                    
                    // Display formatted metrics
                    const formatted = `
📚 QUALIFICATIONS:
   Total: ${data.totalQualifications}
   Legacy: ${data.legacyQualifications}
   Occupational: ${data.occupationalQualifications}

📋 UNIT STANDARDS:
   Total: ${data.totalUnitStandards}
   Legacy: ${data.legacyUnitStandards}
   Occupational: ${data.occupationalUnitStandards}

❓ ASSESSMENT QUESTIONS:
   Total: ${data.totalQuestions}
   Formative: ${data.formativeQuestions}
   Summative: ${data.summativeQuestions}

📝 ASSESSMENTS:
   Total: ${data.totalAssessments}
   Formative: ${data.formativeAssessments}
   Summative: ${data.summativeAssessments}

🎯 PROJECT DATA:
   Active Projects with Qualifications: ${data.activeProjectsWithQualifications}
   Project Qualifications: ${data.projectQualifications}
   Project Unit Standards: ${data.projectUnitStandards}
                    `;
                    
                    addResult('📊 Formatted QA Metrics', formatted);
                } else {
                    addResult('❌ QA Metrics Error', `Status: ${response.status}\n${JSON.stringify(data, null, 2)}`, true);
                }
            } catch (error) {
                addResult('❌ Network Error', error.message, true);
            }
        }
        
        // Auto-test on page load
        window.onload = function() {
            addResult('🚀 QA Overview API Tester', 'Ready to test QA metrics endpoint. Click the button above to start.');
        };
    </script>
</body>
</html>
