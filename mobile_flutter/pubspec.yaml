name: nbsn_mobile
description: NBSN Mobile App with Document Scanning
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # UI
  cupertino_icons: ^1.0.6
  
  # Navigation
  go_router: ^17.2.3
  
  # State Management
  provider: ^6.1.1
  
  # Utils
  intl: ^0.20.2
  
  # HTTP & API
  dio: ^5.4.0
  
  # Storage
  shared_preferences: ^2.2.2
  
  # Offline queue & connectivity
  sqflite: ^2.3.2
  connectivity_plus: ^6.0.5
  
  # Document Scanning with Edge Detection
  cunning_document_scanner: ^1.2.2
  
  # PDF Generation
  pdf: ^3.10.7
  printing: ^5.11.1
  
  # Image Processing
  image: ^4.2.0
  image_picker: ^1.0.7
  camera: ^0.12.0+1
  google_mlkit_face_detection: ^0.13.2
  tflite_flutter: ^0.12.1
  
  # File Handling
  path_provider: ^2.1.2
  path: ^1.9.0
  
  # Permissions
  permission_handler: ^12.0.1

  # Location & Geofencing
  geolocator: ^14.0.2
  
  # HTTP Multipart
  http: ^1.1.0
  http_parser: ^4.0.2
  
  # Signature Capture
  signature: ^6.3.0
  
  # URL Launcher
  url_launcher: ^6.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter:
  uses-material-design: true

  assets:
    - assets/models/mobilefacenet.tflite
    - assets/app_icon.png

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  min_sdk_android: 21
  adaptive_icon_background: "#0052CC"
  adaptive_icon_foreground: "assets/app_icon.png"
