<!DOCTYPE html>
<html>
<head>
    <title>Test QA Overview API - Updated</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .result { margin: 20px 0; padding: 15px; border: 1px solid #ccc; border-radius: 5px; }
        .success { background-color: #d4edda; border-color: #c3e6cb; }
        .error { background-color: #f8d7da; border-color: #f5c6cb; }
        pre { background-color: #f8f9fa; padding: 10px; border-radius: 3px; overflow-x: auto; }
        button { padding: 10px 20px; margin: 5px; background-color: #007bff; color: white; border: none; border-radius: 3px; cursor: pointer; }
        button:hover { background-color: #0056b3; }
    </style>
</head>
<body>
    <h1>QA Overview API Test - Updated</h1>
    <button onclick="testQAMetrics()">Test QA Metrics</button>
    <button onclick="testUnitStandardBreakdown()">Test Unit Standard Breakdown</button>
    <div id="result"></div>

    <script>
        async function testQAMetrics() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing QA Metrics...</div>';
            
            try {
                const response = await fetch('http://192.168.68.117:5213/api/QAOverview/metrics');
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ QA Metrics Success!</h3>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ QA Metrics Error: ${response.status}</h3>
                            <p>${response.statusText}</p>
                            <pre>${errorText}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }

        async function testUnitStandardBreakdown() {
            const resultDiv = document.getElementById('result');
            resultDiv.innerHTML = '<div class="result">Testing Unit Standard Breakdown...</div>';
            
            try {
                const response = await fetch('http://192.168.68.117:5213/api/QAOverview/unit-standard-breakdown');
                
                if (response.ok) {
                    const data = await response.json();
                    resultDiv.innerHTML = `
                        <div class="result success">
                            <h3>✅ Unit Standard Breakdown Success!</h3>
                            <p>Found ${data.length} unit standards with assessments</p>
                            <pre>${JSON.stringify(data, null, 2)}</pre>
                        </div>
                    `;
                } else {
                    const errorText = await response.text();
                    resultDiv.innerHTML = `
                        <div class="result error">
                            <h3>❌ Unit Standard Breakdown Error: ${response.status}</h3>
                            <p>${response.statusText}</p>
                            <pre>${errorText}</pre>
                        </div>
                    `;
                }
            } catch (error) {
                resultDiv.innerHTML = `
                    <div class="result error">
                        <h3>❌ Network Error</h3>
                        <p>${error.message}</p>
                    </div>
                `;
            }
        }
    </script>
</body>
</html>
