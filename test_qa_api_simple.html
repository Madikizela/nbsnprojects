<!DOCTYPE html>
<html>
<head>
    <title>Test QA API</title>
</head>
<body>
    <h1>QA API Test</h1>
    <div id="result"></div>
    
    <script>
        async function testQAAPI() {
            try {
                console.log('Testing QA Overview API...');
                
                // Test metrics endpoint
                const response = await fetch('http://192.168.68.117:5213/api/QAOverview/metrics');
                console.log('Response status:', response.status);
                
                if (response.ok) {
                    const data = await response.json();
                    console.log('QA Metrics:', data);
                    document.getElementById('result').innerHTML = `
                        <h2>QA Metrics Success!</h2>
                        <pre>${JSON.stringify(data, null, 2)}</pre>
                    `;
                } else {
                    const error = await response.text();
                    console.error('API Error:', error);
                    document.getElementById('result').innerHTML = `
                        <h2>API Error</h2>
                        <p>Status: ${response.status}</p>
                        <pre>${error}</pre>
                    `;
                }
            } catch (error) {
                console.error('Network Error:', error);
                document.getElementById('result').innerHTML = `
                    <h2>Network Error</h2>
                    <pre>${error.message}</pre>
                `;
            }
        }
        
        // Test on page load
        testQAAPI();
    </script>
</body>
</html>
