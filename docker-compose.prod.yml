version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.production
    container_name: rlms-backend-prod
    restart: always
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - ConnectionStrings__DefaultConnection=${REMOTE_DB_CONNECTION_STRING}
      - JwtSettings__SecretKey=${JWT_SECRET}
      - Encryption__DataKey=${ENCRYPTION_DATA_KEY}
      - Email__SmtpHost=${SMTP_HOST}
      - Email__SmtpPort=${SMTP_PORT}
      - Email__SmtpUsername=${SMTP_USER}
      - Email__SmtpPassword=${SMTP_PASS}
      - Email__FromEmail=${FROM_EMAIL}
      - Email__FromName=${FROM_NAME}
    networks:
      - app-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.production
      args:
        - VITE_API_URL=/api
    container_name: rlms-frontend-prod
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
