name: Docker Security Scan

on:
  push:
    branches: [ "main" ]
    paths:
      - '**/Dockerfile*'
      - '.github/workflows/docker-security.yml'
  pull_request:
    branches: [ "main" ]
    paths:
      - '**/Dockerfile*'
  schedule:
    - cron: '0 10 * * 1'  # Weekly on Mondays
  workflow_dispatch:

jobs:
  docker-scan:
    name: Scan Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    
    strategy:
      matrix:
        dockerfile:
          - frontend/Dockerfile.production
          - backend/Dockerfile.production
    
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Extract image name
        id: image
        run: |
          IMAGE_NAME=$(echo "${{ matrix.dockerfile }}" | cut -d'/' -f1)
          echo "name=$IMAGE_NAME" >> $GITHUB_OUTPUT

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./${{ steps.image.outputs.name }}
          file: ${{ matrix.dockerfile }}
          push: false
          load: true
          tags: nbsn-${{ steps.image.outputs.name }}:test

      - name: Run Trivy vulnerability scanner
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: nbsn-${{ steps.image.outputs.name }}:test
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Run Snyk Container Test
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: nbsn-${{ steps.image.outputs.name }}:test
          args: --severity-threshold=high --file=${{ matrix.dockerfile }}

      - name: Run Docker Bench Security
        run: |
          docker run --rm --net host --pid host --userns host --cap-add audit_control \
            -v /var/lib:/var/lib \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v /usr/lib/systemd:/usr/lib/systemd \
            -v /etc:/etc --label docker_bench_security \
            docker/docker-bench-security || true
