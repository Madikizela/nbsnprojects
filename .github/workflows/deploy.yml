name: CI/CD Multi-Environment Deployment

on:
  push:
    branches: [ "main", "develop" ]
  workflow_dispatch:

jobs:
  # JOB 1: Build and Verify Code (Dev Pass)
  build-and-verify:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Build Backend (Verify)
      run: |
        cd backend
        dotnet build -c Release

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend (Verify)
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: /api

  # JOB 2: Deploy to Server (Only runs if Build-and-Verify passes)
  deploy:
    needs: build-and-verify
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' # Don't deploy on PRs, only on pushes
    environment:
      name: ${{ github.ref == 'refs/heads/main' && 'production' || 'staging' }}

    steps:
    - uses: actions/checkout@v4

    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 9.0.x

    - name: Publish Backend for Deployment
      run: |
        cd backend
        dotnet publish -c Release -r linux-x64 --self-contained true -o ./publish

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json

    - name: Install Frontend Dependencies
      run: |
        cd frontend
        npm ci

    - name: Build Frontend for Deployment
      run: |
        cd frontend
        npm run build
      env:
        VITE_API_URL: /api

    # --- DEPLOY FRONTEND (via FTP) ---
    - name: Deploy Frontend (FTP)
      uses: SamKirkland/FTP-Deploy-Action@v4.3.5
      with:
        server: ${{ github.ref == 'refs/heads/main' && secrets.PROD_FTP_SERVER || secrets.STAGING_FTP_SERVER }}
        username: ${{ github.ref == 'refs/heads/main' && secrets.PROD_FTP_USERNAME || secrets.STAGING_FTP_USERNAME }}
        password: ${{ github.ref == 'refs/heads/main' && secrets.PROD_FTP_PASSWORD || secrets.STAGING_FTP_PASSWORD }}
        local-dir: ./frontend/dist/
        server-dir: public_html/
        dangerous-clean-slate: false

    # --- DEPLOY BACKEND (via SSH) ---
    - name: Deploy Backend (SSH)
      uses: appleboy/scp-action@v0.1.7
      with:
        host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_HOST || secrets.STAGING_SSH_HOST }}
        username: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_USERNAME || secrets.STAGING_SSH_USERNAME }}
        key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_PRIVATE_KEY || secrets.STAGING_SSH_PRIVATE_KEY }}
        port: ${{ (github.ref == 'refs/heads/main' && secrets.PROD_SSH_PORT) || secrets.STAGING_SSH_PORT || 22 }}
        source: "backend/publish/*"
        target: "~/nbsn_api"
        strip_components: 2

    - name: Restart Backend (SSH)
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_HOST || secrets.STAGING_SSH_HOST }}
        username: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_USERNAME || secrets.STAGING_SSH_USERNAME }}
        key: ${{ github.ref == 'refs/heads/main' && secrets.PROD_SSH_PRIVATE_KEY || secrets.STAGING_SSH_PRIVATE_KEY }}
        port: ${{ (github.ref == 'refs/heads/main' && secrets.PROD_SSH_PORT) || secrets.STAGING_SSH_PORT || 22 }}
        script: |
          cd ~/nbsn_api
          fuser -k 5213/tcp || true
          chmod +x backend
          nohup ./backend --urls "http://127.0.0.1:5213" > app.log 2>&1 &
