name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  # ──────────────────────────────────────────────
  # 1. Build and Lint Backend
  # ──────────────────────────────────────────────
  build-backend:
    name: Build & Lint Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 9.0.x

      - name: Restore dependencies
        run: dotnet restore
        working-directory: backend

      - name: Build Backend
        run: dotnet build --no-restore --configuration Release /p:TreatWarningsAsErrors=false
        working-directory: backend

  # ──────────────────────────────────────────────
  # 2. Build and Lint Frontend
  # ──────────────────────────────────────────────
  build-frontend:
    name: Build & Lint Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Lint Frontend
        run: npm run lint || true
        working-directory: frontend

      - name: Build Frontend
        run: npm run build
        working-directory: frontend

  # ──────────────────────────────────────────────
  # NOTE: Deployment is handled automatically by Railway's GitHub integration.
  # Railway watches the main branch and redeploys each service on every push.
  # No manual deploy step needed here.
  # ──────────────────────────────────────────────
